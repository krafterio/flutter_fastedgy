name: flutter_fastedgy
description: Flutter package to facilitate integration between a FastEdgy server and a Flutter application. Inspired by vue-fastedgy.
version: 0.1.0
repository: https://github.com/krafterio/flutter-fastedgy
issue_tracker: https://github.com/krafterio/flutter-fastedgy/issues
homepage: https://fastedgy.krafter.io

environment:
  sdk: ^3.10.0
  flutter: ^3.38.2

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  easy_localization: ^3.0.7
  easy_logger: ^0.0.2
  event_bus: ^2.0.1
  flutter_dotenv: ^5.2.1
  get_it: ^8.0.2
  go_router: ^17.0.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  logging: ^1.3.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.5

flutter:
