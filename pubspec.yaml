name: flutter_fastedgy
description: Flutter package to facilitate integration between a FastEdgy server and a Flutter application. Inspired by vue-fastedgy.
version: 0.1.0
repository: https://github.com/krafterio/flutter-fastedgy
issue_tracker: https://github.com/krafterio/flutter-fastedgy/issues
homepage: https://fastedgy.krafter.io

environment:
  sdk: ^3.10.0
  flutter: ^3.38.2

dependencies:
  flutter:
    sdk: flutter

  appflowy_editor: '>=6.1.0 <7.0.0'
  dio: ^5.9.0
  easy_localization: ^3.0.8
  easy_logger: ^0.0.2
  event_bus: ^2.0.1
  flutter_dotenv: ^6.0.0
  get_it: ^9.2.0
  go_router: ^17.0.1
  image: ^4.5.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  logging: ^1.3.0
  markdown: ^7.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  re_highlight: ^0.0.3
  permission_handler: ^12.0.1
  provider: ^6.1.5
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  flutter_timezone: ^5.0.1
  package_info_plus: ^9.0.0
  device_info_plus: ^12.0.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.0
  connectivity_plus: ^7.3.0

# No published appflowy_editor compiles against Flutter 3.44. Ignored when an
# application depends on this package, so every root repeats it.
dependency_overrides:
  appflowy_editor:
    git:
      url: https://github.com/AppFlowy-IO/appflowy-editor.git
      ref: 41335c54aea1ecc61e0bee107757ab3c0a98ce43

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.1

flutter:
  assets:
    - assets/translations/
